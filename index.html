<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>VideoShare</title>

    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#c67139" />
    <link rel="icon" href="/icons/icon-512.png" />

    <!-- iOS ignores the manifest above for home-screen install, so it needs its own tags. -->
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="VideoShare" />

    <!-- Google Identity Services: provides the sign-in popup -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
  </head>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
